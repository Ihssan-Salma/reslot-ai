[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reslot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.2.0",
  "httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3", "cryptography>=46,<51", "python-dotenv>=1,<2",
  "argon2-cffi>=25.1,<26", "email-validator>=2.2,<3", "tzdata>=2025.1",
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<2.1", "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6", "langgraph>=1,<2", "groq>=0.20,<2",
  "google-api-python-client>=2.160,<3", "google-auth-oauthlib>=1.2,<2",
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running PostgreSQL database"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

# SQL trigger definitions retain their SQL layout. Python checks remain enabled.
[tool.ruff.lint.per-file-ignores]
"migrations/versions/000[5-8]*.py" = ["E501"]
