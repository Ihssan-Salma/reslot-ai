name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reslot
          POSTGRES_DB: reslot
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reslot -d reslot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://reslot_app:ci-runtime-password@127.0.0.1:5432/reslot
      MIGRATION_DATABASE_URL: postgresql+psycopg://reslot:ci-only-password@127.0.0.1:5432/reslot
      APP_DATABASE_PASSWORD: ci-runtime-password
      TEST_DATABASE_URL: postgresql+psycopg://reslot_app:ci-runtime-password@127.0.0.1:5432/reslot
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://reslot:ci-only-password@127.0.0.1:5432/reslot
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: python -m app.db.migrate
      - run: python scripts/test_backend.py --database
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
